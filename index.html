<script>
/* 行程資料:來源=Ethan 的教學日曆(照亮角落的地圖),粉絲版文案由小編室維護。
   status: open=報名中 / full=額滿 / closed=包班(不公開招生) */
var COURSES = [
  {from:"2026-08-22", to:"2026-08-22", name:"我的時間,我作主|數位生存訓練營",
   place:"高雄", status:"open",
   desc:"給青少年的一日課:看見自己與手機的關係,把時間的主導權拿回來。"},
  {from:"2026-08-28", to:"2026-09-30", when:"8/28(五)開課・週末班,共 8 天",
   name:"NGH 催眠師資班",
   place:"", status:"open",
   desc:"NGH 國際催眠師認證課程,週末上課、共八天完整班。詳情與報名方式請私訊粉專。"},
  {from:"2026-09-12", to:"2026-09-12", name:"影響力工作坊",
   place:"高雄", status:"open",
   desc:"一天的影響力課:讓你說的話,真的進到別人心裡。詳情請私訊粉專。"},
  {from:"2026-09-13", to:"2026-09-13", name:"說服力課程",
   place:"中國文化大學推廣教育部", status:"open",
   desc:"詳情與報名方式請私訊粉專。"}
];

function fmt(d){
  var p = d.split("-");
  var wd = ["日","一","二","三","四","五","六"][new Date(d + "T00:00:00+08:00").getDay()];
  return p[1].replace(/^0/,"") + "/" + p[2].replace(/^0/,"") + "(" + wd + ")";
}
function render(){
  var today = new Date();
  today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  var html = "";
  var shown = 0;
  for (var i = 0; i < COURSES.length; i++) {
    var c = COURSES[i];
    var end = new Date(c.to + "T23:59:59+08:00");
    if (end < today) continue; /* 過期自動消失 */
    shown++;
    var when = c.when ? c.when : (fmt(c.from) + (c.to !== c.from ? " – " + fmt(c.to) : ""));
    var year = c.from.slice(0,4);
    var tag = c.status === "open" ? "<span class='tag open'>報名中</span>"
            : c.status === "full" ? "<span class='tag full'>已額滿</span>"
            : "<span class='tag closed'>包班</span>";
    html += "<div class='card'>"
      + "<div class='when'>" + year + " 年 " + when + "</div>"
      + "<div class='cname'>" + c.name + tag + "</div>"
      + (c.place ? "<div class='meta'>📍 " + c.place + "</div>" : "")
      + (c.desc ? "<div class='desc'>" + c.desc + "</div>" : "")
      + "</div>";
  }
  if (!shown) html = "<div class='empty'>近期課程籌備中——<br>追蹤粉專,開課第一時間通知你。</div>";
  document.getElementById("list").innerHTML = html;
}
render();
</script>
