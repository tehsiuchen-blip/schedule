  {from:"2026-08-28", to:"2026-09-20", when:"8/28 開課・共 8 天(8/28–30・9/4–6・9/19–20)", name:"NGH 催眠師證照班", place:"台中・生命源點身心整合學苑", status:"open", link:"https://www.lifesource888.com/article.php?lang=tw&tb=13&cid=185", desc:"NGH 國際催眠證照課程,三個週末共八天(9:30–17:30),精緻小班 12 人額滿。"},

function fmt(d){
  var p = d.split("-");
  var wd = ["日","一","二","三","四","五","六"][new Date(d + "T00:00:00+08:00").getDay()];
  return p[1].replace(/^0/,"") + "/" + p[2].replace(/^0/,"") + "(" + wd + ")";
}
function render(){
  var today = new Date();
  today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  var html = "";
  var shown = 0;
  for (var i = 0; i < COURSES.length; i++) {
    var c = COURSES[i];
    var end = new Date(c.to + "T23:59:59+08:00");
    if (end < today) continue; /* 過期自動消失 */
    shown++;
    var when = c.when ? c.when : (fmt(c.from) + (c.to !== c.from ? " – " + fmt(c.to) : ""));
    var year = c.from.slice(0,4);
    var tag = c.status === "open" ? "<span class='tag open'>報名中</span>"
            : c.status === "full" ? "<span class='tag full'>已額滿</span>"
            : "<span class='tag closed'>包班</span>";
    html += "<div class='card'>"
      + "<div class='when'>" + year + " 年 " + when + "</div>"
      + "<div class='cname'>" + c.name + tag + "</div>"
      + (c.place ? "<div class='meta'>📍 " + c.place + "</div>" : "")
      + (c.desc ? "<div class='desc'>" + c.desc + "</div>" : "")
      + (c.link ? "<a class='book' href='" + c.link + "' target='_blank' rel='noopener'>報名・課程詳情</a>" : "")
      + "</div>";
  }
  if (!shown) html = "<div class='empty'>近期課程籌備中——<br>追蹤粉專,開課第一時間通知你。</div>";
  document.getElementById("list").innerHTML = html;
}
render();
